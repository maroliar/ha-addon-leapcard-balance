name: "LeapCard Balance"
version: "0.1.0"
slug: "leapcard_balance"
description: "Query LeapCard (TFI Ireland) balance and history."
url: "https://github.com/maroliar/ha-addon-leapcard-balance"
arch:
  - amd64
  - aarch64
init: false
hassio_api: true
homeassistant_api: true

options:
  leapcard_username: ""
  leapcard_password: ""
  update_interval_minutes: 1440   # once a day

schema:
  leapcard_username: "str"
  leapcard_password: "password"
  update_interval_minutes: "int(15,10080)"